<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 64" fill="none" role="img" aria-label="SingaTech Mash">
  <defs>
    <linearGradient id="stGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- ===== Монограмма: шестерёнка + ретро-станок внутри ===== -->
  <g transform="translate(4 8)">
    <!-- Внешняя шестерёнка (зубчатый контур) -->
    <path d="M24 2.5
             l3.6 0 .9 4.1a17.7 17.7 0 0 1 4 1.7l3.4-2.4 2.6 2.6-2.4 3.4a17.7 17.7 0 0 1 1.7 4l4.1.9v3.6l-4.1.9a17.7 17.7 0 0 1-1.7 4l2.4 3.4-2.6 2.6-3.4-2.4a17.7 17.7 0 0 1-4 1.7l-.9 4.1h-3.6l-.9-4.1a17.7 17.7 0 0 1-4-1.7l-3.4 2.4-2.6-2.6 2.4-3.4a17.7 17.7 0 0 1-1.7-4L2.5 27.6v-3.6l4.1-.9a17.7 17.7 0 0 1 1.7-4L5.9 15.7l2.6-2.6 3.4 2.4a17.7 17.7 0 0 1 4-1.7l.9-4.1z"
          fill="url(#stGrad)"/>
    <!-- Внутренний вырез под станок -->
    <circle cx="24" cy="24" r="12.2" fill="#1A1D21"/>
    <!-- Ретро-станок: станина + шпиндель + суппорт -->
    <g fill="url(#stGrad)">
      <rect x="15" y="27.5" width="18" height="3" rx="0.8"/>
      <rect x="15" y="30.5" width="2.4" height="5" rx="0.5"/>
      <rect x="30.6" y="30.5" width="2.4" height="5" rx="0.5"/>
      <rect x="19.5" y="19.5" width="9" height="4.5" rx="0.8"/>
      <rect x="23.6" y="22.5" width="1.8" height="5"/>
      <rect x="21" y="16.8" width="6" height="3.4" rx="0.8"/>
      <!-- заготовка/резцедержатель -->
      <rect x="18" y="24" width="3.4" height="3.5" rx="0.6"/>
    </g>
  </g>

  <!-- ===== Текст: SingaTech Mash ===== -->
  <g transform="translate(64 0)">
    <text x="0" y="36" font-family="Montserrat, Inter, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#F7F8FA">Singa</tspan><tspan fill="#FF6A00">Tech</tspan><tspan fill="#F7F8FA" dx="6">Mash</tspan>
    </text>
    <text x="1" y="52" font-family="Inter, sans-serif" font-size="8.4" font-weight="500" letter-spacing="1.6" fill="#7FA8C9" text-transform="uppercase">
      Высокоточное оборудование из Сингапура
    </text>
  </g>
</svg>